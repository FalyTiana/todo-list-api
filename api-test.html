<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Test API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f0e8;
            color: #1b1a18;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        section {
            background: white;
            padding: 24px;
            border: 1px solid #e5ddd1;
            border-radius: 14px;
        }

        button {
            background: #1b1a18;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        #resultat {
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <section>
        <h1>TaskFlow — Test API</h1>
        <p>Clique pour récupérer une tâche depuis une API.</p>

        <button id="charger-tache">Charger une tâche</button>

        <div id="resultat" aria-live="polite">
            Aucune tâche chargée.
        </div>
    </section>


    <script>
        const bouton = document.querySelector("#charger-tache");
        const resultat = document.querySelector("#resultat");

        bouton.addEventListener("click", function () {
            resultat.textContent = "Chargement des tâches...";
            bouton.disabled = true;

            fetch("https://jsonplaceholder.typicode.com/todos?_limit=5")
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Erreur HTTP : " + response.status);
                    }

                    return response.json();
                })
                .then(tasks => {
                    const liste = document.createElement("ul");

                    tasks.forEach(task => {
                        const element = document.createElement("li");

                        const titre = document.createElement("strong");
                        titre.textContent = task.title;

                        const statut = document.createElement("span");
                        statut.textContent = task.completed
                            ? " — Terminée"
                            : " — En cours";

                        element.append(titre, statut);
                        liste.appendChild(element);
                    });

                    resultat.replaceChildren(liste);

                    if (tasks.length === 0) {
                        resultat.textContent = "Aucune tâche trouvée.";
                    }
                })
                .catch(error => {
                    resultat.textContent =
                        "Impossible de charger les tâches. Vérifie ta connexion.";
                    console.error("Erreur API :", error);
                })
                .finally(() => {
                    bouton.disabled = false;
                });
        });
    </script>

</body>

</html>
